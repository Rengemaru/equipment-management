apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: equipment-management
  namespace: equipment-management
  labels:
    app.kubernetes.io/name: equipment-management
    app.kubernetes.io/component: routing
spec:
  ingressClassName: traefik
  rules:
    # Both operators reach the same LAN through their own Tailscale subnet
    # router. A hostless rule allows either tailnet to use the Traefik LAN IP
    # without depending on a DNS name owned by one tailnet.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: equipment-management
                port:
                  name: http
