apiVersion: apps/v1
kind: Deployment
metadata:
  name: equipment-management
  namespace: equipment-management
  labels:
    app.kubernetes.io/name: equipment-management
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: equipment-management
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: equipment-management
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k3s-server
      imagePullSecrets:
        - name: equipment-management-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # The deployment overlay must replace this with an immutable sha-* tag.
          image: equipment-management:0.0.0-unpublished
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: DB_PATH
              value: /data/app.db
            - name: UPLOAD_DIR
              value: /uploads
          envFrom:
            - secretRef:
                # Must contain HOST_URL, SESSION_SECRET, and COOKIE_SECURE.
                name: equipment-management-runtime
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: uploads
              mountPath: /uploads
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: equipment-management-data
        - name: uploads
          persistentVolumeClaim:
            claimName: equipment-management-uploads
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
